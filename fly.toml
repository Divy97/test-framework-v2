# fly.toml app configuration file generated for test-framework on 2026-08-30T22:15:17+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'test-framework'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.plane'

[env]
  ENGINE_BIND = '0.0.0.0'
  ENGINE_BLOB_ROOT = '/var/lib/plane/blobs'
  PORT = '8788'

[[mounts]]
  source = 'plane_blobs'
  destination = '/var/lib/plane'

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
