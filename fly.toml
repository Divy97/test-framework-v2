# fly.toml app configuration file generated for test-framework on 2026-08-30T22:15:17+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'test-framework'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.plane'

[env]
  ENGINE_BIND = '0.0.0.0'
  ENGINE_BLOB_ROOT = '/var/lib/plane/blobs'
  PORT = '8788'

[[mounts]]
  source = 'plane_blobs'
  destination = '/var/lib/plane'

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  # `/` — and since 10i that path checks one more thing than it used to.
  #
  # It was a rendered landing page, so a 200 meant the process was up. It is now the
  # dashboard's static bundle, served by `src/static.ts` from `/app/web/out`, and a
  # deployment whose image did not build that bundle answers 503 here rather than a page.
  # So this check now also fails a deploy that shipped a plane with no front end — which is
  # the right outcome, and worth writing down because the failure would otherwise present
  # as "the site is blank" long after the deploy reported success.
  #
  # The JSON API and the SSE tail are unaffected by that state, and the 503 body says so.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
